# pnpm workspace root for @toreda/data-structures.
#
# The library itself is the root package; `packages` lists additional members.
# Add new members here (e.g. "packages/*") as the repo grows.
packages: []
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  es5-ext: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@toreda/shared-types@3.0.1'
onlyBuiltDependencies:
  - '@swc/core'
  - es5-ext
  - unrs-resolver
